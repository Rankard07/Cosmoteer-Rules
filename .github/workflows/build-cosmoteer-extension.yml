name: Build Cosmoteer Rules Extension Artifacts
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build VSIX and ZIP
        shell: bash
        run: |
          set -euo pipefail
          SRC="cosmoteer-rules-language-source-v2.4.1-custom-words/extension"
          VERSION=$(python3 - <<'PY'
          import json
          p='cosmoteer-rules-language-source-v2.4.1-custom-words/extension/package.json'
          print(json.load(open(p, encoding='utf-8'))['version'])
          PY
          )
          WORK="build/cosmoteer-rules"
          mkdir -p "$WORK/extension/syntaxes" dist
          cp "$SRC/package.json" "$WORK/extension/"
          cp "$SRC/extension.js" "$WORK/extension/"
          cp "$SRC/language-configuration.json" "$WORK/extension/"
          cp "$SRC/cosmoteer-rules-textmate-settings.jsonc" "$WORK/extension/"
          cp "$SRC/cosmoteer-rules-custom.jsonc" "$WORK/extension/"
          cp "$SRC/syntaxes/cosmoteer-rules.tmLanguage.json" "$WORK/extension/syntaxes/"
          cat > "$WORK/[Content_Types].xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
            <Default Extension="json" ContentType="application/json" />
            <Default Extension="jsonc" ContentType="application/json" />
            <Default Extension="js" ContentType="application/javascript" />
            <Default Extension="xml" ContentType="application/xml" />
            <Default Extension="vsixmanifest" ContentType="text/xml" />
          </Types>
          XML
          cat > "$WORK/extension.vsixmanifest" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <PackageManifest Version="2.0.0" xmlns="http://schemas.microsoft.com/developer/vsx-schema/2011">
            <Metadata>
              <Identity Language="en-US" Id="cosmoteer-rules-language" Version="$VERSION" Publisher="zahran" />
              <DisplayName>Cosmoteer Rules Language</DisplayName>
              <Description xml:space="preserve">Cosmoteer .rules/.rule language mode with syntax highlighting plus editable custom-word and TextMate color configuration files.</Description>
              <Tags>cosmoteer,rules</Tags>
              <Categories>Programming Languages</Categories>
              <Properties><Property Id="Microsoft.VisualStudio.Code.Engine" Value=">=1.85.0" /></Properties>
            </Metadata>
            <Installation><InstallationTarget Id="Microsoft.VisualStudio.Code" /></Installation>
            <Dependencies />
            <Assets>
              <Asset Type="Microsoft.VisualStudio.Code.Manifest" Path="extension/package.json" />
              <Asset Type="Microsoft.VisualStudio.Code.Grammar" Path="extension/syntaxes/cosmoteer-rules.tmLanguage.json" Addressable="true" />
            </Assets>
          </PackageManifest>
          XML
          (cd "$WORK" && zip -qr "../../dist/cosmoteer-rules-language-v$VERSION.zip" extension)
          (cd "$WORK" && zip -qr "../../dist/cosmoteer-rules-language-v$VERSION.vsix" '[Content_Types].xml' extension.vsixmanifest extension)
      - uses: actions/upload-artifact@v4
        with:
          name: cosmoteer-rules-language-v2.4.2
          path: dist/*
          if-no-files-found: error